<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1326">
<title>MP Inventory Code - Master X</title>
<style>
:root{--bg:#070913;--panel:#0d1326;--border:#1e293b;--cyan:#00f2ff;--pink:#ff007f;--green:#00ff88;--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif;padding:10px}header,.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.25rem;color:var(--cyan);margin:0}.title{color:var(--cyan);font-weight:800;font-size:1.05rem;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:5px}input,select,button{width:100%;border-radius:6px;padding:12px;font-size:1rem}input,select{background:#030712;color:white;border:1px solid var(--border)}button{border:1px solid var(--cyan);background:#0b5060;color:var(--cyan);font-weight:800;margin-top:10px}.pink{border-color:var(--pink);color:var(--pink);background:#57003a}.green{border-color:var(--green);color:#001b10;background:var(--green)}#preview{width:100%;max-height:300px;object-fit:contain;margin-top:10px;border-radius:8px;display:none}.row{display:flex;gap:8px}.row button{flex:1}.item{border-top:1px solid var(--border);padding:10px 0}.small{color:var(--muted);font-size:.82rem}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:1.08rem}}
</style>
</head>
<body>
<header><h1>MP INVENTORY CODE</h1><span id="count">FOTO: 0</span></header>
<section class="card"><div class="title">1. SCOMPOSIZIONE & RILEVAMENTO</div>
<div class="grid"><div class="field"><label>SETTORE VEICOLO</label><select id="sector"><option>Anteriore</option><option>Posteriore</option><option>Motore</option><option>Interno</option><option>Altro</option></select></div><div class="field"><label>MODELLO VEICOLO</label><input id="model" placeholder="es. Yaris"></div></div>
<input id="camera" type="file" accept="image/*" capture="environment" hidden><button id="cam">📷 ATTIVA FOTOCAMERA</button><button id="shot" class="pink">⚡ SCATTA / CARICA FOTO</button><img id="preview" alt="Anteprima foto">
<div class="grid" style="margin-top:10px"><div class="field"><label>TIPO RICAMBIO *</label><input id="part" placeholder="es. Faro anteriore"></div><div class="field"><label>ANNO / SERIE</label><input id="year" placeholder="es. 99-05"></div><div class="field"><label>CODICE OEM</label><input id="oem" placeholder="Opzionale"></div><div class="field"><label>UBICAZIONE</label><input id="loc" placeholder="Scaffale / Scatola"></div></div>
<button id="web">🌐 TRIANGOLA WEB</button><button id="add" class="green">✚ CARICA IN INVENTARIO</button></section>
<section class="card"><div class="title">2. INVENTARIO REATTIVO</div><div class="row"><button id="report">📊 REPORT</button><button id="reset" class="pink">🗑 RESET</button></div><div id="list"></div></section>
<script>
const $=id=>document.getElementById(id);let photo='';let items=JSON.parse(localStorage.getItem('mp_inventory')||'[]');function save(){localStorage.setItem('mp_inventory',JSON.stringify(items));render()}function render(){$('list').innerHTML=items.length?items.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.part)}</b><div class="small">${esc(x.oem||'OEM non inserito')} · ${esc(x.model||'')} ${esc(x.year||'')} · ${esc(x.loc||'')}</div><button onclick="delItem(${i})">ELIMINA</button></div>`).join(''):'<div class="small" style="padding-top:12px">Inventario vuoto.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.delItem=i=>{items.splice(i,1);save()};$('cam').onclick=()=>$('camera').click();$('shot').onclick=()=>$('camera').click();$('camera').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;$('preview').src=photo;$('preview').style.display='block';$('count').textContent='FOTO: 1'};r.readAsDataURL(f)};$('add').onclick=()=>{const part=$('part').value.trim();if(!part){alert('Inserisci il tipo ricambio.');return}items.push({sector:$('sector').value,model:$('model').value.trim(),part,year:$('year').value.trim(),oem:$('oem').value.trim(),loc:$('loc').value.trim(),photo:photo?'presente':'',date:new Date().toISOString()});save();$('part').value=$('oem').value=$('loc').value='';photo='';$('preview').style.display='none';$('count').textContent='FOTO: 0'};$('web').onclick=()=>{const q=[$('oem').value,$('part').value,$('model').value].filter(Boolean).join(' ');if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')};$('reset').onclick=()=>{if(confirm('Cancellare tutto l’inventario locale?')){items=[];save()}};$('report').onclick=()=>{const csv=['Ricambio,OEM,Modello,Anno,Ubicazione',...items.map(x=>[x.part,x.oem,x.model,x.year,x.loc].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(','))].join('
');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='MP_Inventory_Report.csv';a.click()};render();
</script>
</body></html>
